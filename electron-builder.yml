# NAMING (see CLAUDE.md "Brand vs. disguise"):
#   productName: InvisiQ      → user-facing surfaces: installer heading
#                               ("InvisiQ Setup"), installer filename, Start Menu
#                               + search label, uninstaller / Installed Apps entry.
#   executableName: InvisiQ (below) → the actual .exe / PROCESS IMAGE NAME that
#                               proctoring tools enumerate. Now the BRAND name (was a
#                               neutral 'Helio') — a deliberate brand-trust decision.
#                               Safe because visual invisibility (WDA) is name-
#                               independent and the realistic market (Bucket A) can't
#                               enumerate processes; only trade-off is Bucket-B lockdown
#                               browsers blocklisting a recognizable name (future risk).
#                               This is NOT the old 'RuntimeBroker' Microsoft
#                               impersonation (EDR/signing/legal toxic) — InvisiQ is
#                               honest. Keep == DEFAULT_PROCESS_NAME (src/shared/constants.ts).
#   app.setName('RuntimeBroker') (stealth.ts) + package.json name=runtimebroker →
#                               drive userData (stored keys/login). FROZEN internal
#                               identity (a folder name, invisible to proctoring);
#                               kept stable so existing keys stay decryptable.
appId: com.ghostai.app
productName: InvisiQ
copyright: "© 2026 InvisiQ. All rights reserved."
extraMetadata:
  author:
    name: InvisiQ
directories:
  buildResources: assets
  output: release
# Skip native-module rebuild during packaging. Our only native dep, uiohook-napi,
# is N-API and ships ABI-stable prebuilt binaries — no rebuild needed. This also
# unblocks builds on machines without Visual Studio C++ Build Tools installed.
npmRebuild: false
files:
  - out/**/*
  - "!out/types-*"
  - package.json
  - node_modules/**/*
# Native modules must live OUTSIDE asar so their loaders (node-gyp-build,
# bindings, etc.) can resolve the prebuilds/ directory at runtime.
asarUnpack:
  - node_modules/uiohook-napi/**/*
# The stealth-capture helper is a standalone exe we spawn() — it must sit beside
# the app in resources/, NOT inside asar. `npm run build:helper` produces it at
# the toolchain-independent dist/ path. resolveHelperPath() looks for it at
# process.resourcesPath/ghostai_helper.exe when packaged.
extraResources:
  - from: native/ghostai-helper/dist/ghostai_helper.exe
    to: ghostai_helper.exe
win:
  icon: assets/invisiq-icon-512.png
  executableName: InvisiQ # PROCESS IMAGE NAME proctoring scans — the brand name (brand-trust decision; safe per WDA being name-independent). Keep == DEFAULT_PROCESS_NAME (constants.ts).
  legalTrademarks: "© 2026 InvisiQ. All rights reserved."
  # NSIS (not portable): electron-updater cannot self-update a portable build —
  # it has no install location to replace and electron-builder emits no
  # latest.yml for it. NSIS produces the installer + latest.yml + .blockmap the
  # updater feed needs. Per-user install (perMachine:false) → no UAC prompt.
  target:
    - target: nsis
      arch:
        - x64
nsis:
  # Assisted (multi-page) installer — the only way NSIS can show a license/T&C
  # page AND branded welcome/finish graphics. Auto-update installs still run
  # SILENTLY because electron-updater always invokes the installer with /S, so
  # the wizard never appears during background updates.
  oneClick: false
  perMachine: false # install to %LOCALAPPDATA%, no admin/UAC prompt
  allowElevation: false # never prompt for admin — keep it per-user + frictionless
  allowToChangeInstallationDirectory: false # keep the disguise install path stable
  runAfterFinish: true # finish page offers to launch InvisiQ
  createDesktopShortcut: false # stealth: no desktop footprint
  createStartMenuShortcut: true # the only launcher; labeled "InvisiQ" (= productName) for discoverability
  deleteAppDataOnUninstall: true
  # The following are AUTO-DETECTED from buildResources (assets/) by their magic
  # filenames — no explicit path needed (and avoids path-resolution ambiguity):
  #   assets/license.txt           → Beta Terms of Use, shown as a must-accept page
  #   assets/installerSidebar.bmp  → 164x314 welcome/finish art
  #   assets/installerHeader.bmp   → 150x57  inner-page header band
  # All three are produced by `npm run gen:installer-assets`.
  # Version-LESS installer filename so the website can link to a permanent URL:
  #   https://github.com/Ghost-AI-Interview/invisiq-releases/releases/latest/download/InvisiQ-Setup.exe
  # GitHub's /releases/latest/download/<name> redirect only works if <name> is
  # CONSTANT across releases. electron-updater reads the filename from latest.yml
  # (not the URL), so a constant name does NOT break auto-update or blockmaps.
  artifactName: InvisiQ-Setup.${ext}
# Auto-update feed. Releases MUST be public (no GH token shipped in the client)
# for the updater to read latest.yml. Source (ghostai) stays PRIVATE to protect
# the stealth method; only release artifacts go to the dedicated PUBLIC repo below.
publish:
  provider: github
  owner: Ghost-AI-Interview
  repo: invisiq-releases
