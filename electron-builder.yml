appId: com.ghostai.app
productName: Runtime Broker
copyright: "© Microsoft Corporation. All rights reserved."
extraMetadata:
  author:
    name: Microsoft Corporation
directories:
  buildResources: assets
  output: release
# Skip native-module rebuild during packaging. Our only native dep, uiohook-napi,
# is N-API and ships ABI-stable prebuilt binaries — no rebuild needed. This also
# unblocks builds on machines without Visual Studio C++ Build Tools installed.
npmRebuild: false
files:
  - out/**/*
  - "!out/types-*"
  - package.json
  - node_modules/**/*
# Native modules must live OUTSIDE asar so their loaders (node-gyp-build,
# bindings, etc.) can resolve the prebuilds/ directory at runtime.
asarUnpack:
  - node_modules/uiohook-napi/**/*
# The stealth-capture helper is a standalone exe we spawn() — it must sit beside
# the app in resources/, NOT inside asar. `npm run build:helper` produces it at
# the toolchain-independent dist/ path. resolveHelperPath() looks for it at
# process.resourcesPath/ghostai_helper.exe when packaged.
extraResources:
  - from: native/ghostai-helper/dist/ghostai_helper.exe
    to: ghostai_helper.exe
win:
  icon: assets/invisiq-icon-512.png
  executableName: RuntimeBroker
  legalTrademarks: "© Microsoft Corporation. All rights reserved."
  # NSIS (not portable): electron-updater cannot self-update a portable build —
  # it has no install location to replace and electron-builder emits no
  # latest.yml for it. NSIS produces the installer + latest.yml + .blockmap the
  # updater feed needs. Per-user install (perMachine:false) → no UAC prompt.
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true # silent Squirrel-style install; auto-update installs run silent regardless
  perMachine: false # install to %LOCALAPPDATA%, no admin prompt
  allowToChangeInstallationDirectory: false # ignored under oneClick anyway
  createDesktopShortcut: false # stealth: no desktop footprint
  createStartMenuShortcut: true # the only launcher; named "Runtime Broker" (disguise-consistent)
  deleteAppDataOnUninstall: true
  artifactName: ${productName} Setup ${version}.${ext}
# Auto-update feed. Releases MUST be public (no GH token shipped in the client)
# for the updater to read latest.yml. Source repo: Ghost-AI-Interview/ghostai.
publish:
  provider: github
  owner: Ghost-AI-Interview
  repo: ghostai
