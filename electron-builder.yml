appId: com.ghostai.app
productName: Runtime Broker
copyright: "© Microsoft Corporation. All rights reserved."
extraMetadata:
  author:
    name: Microsoft Corporation
directories:
  buildResources: assets
  output: release
# Skip native-module rebuild during packaging. Our only native dep, uiohook-napi,
# is N-API and ships ABI-stable prebuilt binaries — no rebuild needed. This also
# unblocks builds on machines without Visual Studio C++ Build Tools installed.
npmRebuild: false
files:
  - out/**/*
  - "!out/types-*"
  - package.json
  - node_modules/**/*
# Native modules must live OUTSIDE asar so their loaders (node-gyp-build,
# bindings, etc.) can resolve the prebuilds/ directory at runtime.
asarUnpack:
  - node_modules/uiohook-napi/**/*
win:
  icon: assets/invisiq-icon-512.png
  executableName: RuntimeBroker
  legalTrademarks: "© Microsoft Corporation. All rights reserved."
  target:
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: false
  deleteAppDataOnUninstall: true
publish:
  provider: github
  owner: Nezeon
  repo: GhostAI
