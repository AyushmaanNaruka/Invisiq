appId: com.ghostai.app
productName: SystemHelper
directories:
  buildResources: assets
  output: release
files:
  - out/**/*
  - "!out/types-*"
  - package.json
  - node_modules/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: false
  deleteAppDataOnUninstall: true
publish:
  provider: github
  owner: Nezeon
  repo: GhostAI
