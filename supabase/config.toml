# InvisiQ — Supabase CLI config (Phase 1 backend foundation).
# `supabase link --project-ref <ref>` sets project_id; the placeholder below is
# only used by `supabase start` for a local stack.
project_id = "invisiq-beta"

[functions.entitlement]
# Platform JWT gate ON (belt) + explicit getUser() inside the fn (suspenders).
verify_jwt = true

[functions.telemetry]
verify_jwt = true
